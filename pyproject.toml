[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daml-rag-server"
version = "2.0.0"
description = "DAML-RAG API Server - 三层检索架构"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "薛小川", email = "1336495069@qq.com" }]

dependencies = [
    # MCP Protocol
    "mcp>=0.9.0",
    # 向量化和嵌入
    "sentence-transformers>=2.2.0",
    # 存储
    "redis>=5.0.0",
    "qdrant-client>=1.16.0,<1.17.0",
    "aiomysql>=0.2.0",
    "neo4j>=5.14.0",
    # HTTP API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiohttp>=3.8.0",
    "sse-starlette>=1.6.5",
    # 配置管理
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 机器学习
    "numpy>=1.24.0",
    # 工具
    "PyYAML>=6.0.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "prometheus_client>=0.19.0",
    # JWT认证
    "PyJWT>=2.8.0",
    # LangGraph Agent执行引擎
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LangGraph Checkpoint (Redis 持久化)
    "langgraph-checkpoint-redis>=0.1.0",
    # GraphRAG检索
    "neo4j-graphrag[qdrant]>=1.13.0",
    # BM25混合检索
    "rank_bm25>=0.2.2",
    "jieba>=0.42.1",
    # WebSearch 兜底
    "duckduckgo-search>=6.0.0",
    # OpenTelemetry 全链路追踪 (REQ-11)
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
