# 知识库数据修正（Neo4j 写入）
id: knowledge_correction
name: 知识库数据修正
description: |
  当评测发现数据层问题（禁忌关系缺失、属性不准、分类错误等）时，
  Agent 可通过此 Skill 修正 Neo4j 图数据库中的数据。
  所有写入操作必须经过 HITL（人工确认）后才执行。
triggers:
  - 评测发现某类问题持续低分且归因为数据层
  - 用户/专家反馈某个动作的禁忌关系缺失
  - 发现动作属性（难度/器械/肌群）标注错误
  - 发现营养数据不准确
  - 发现体态矫正关系缺失
required_tools:
  - neo4j_data_patcher
optional_tools:
  - get_user_profile
  - contraindications_checker
  - intelligent_exercise_selector
safety_preconditions:
  user_has_profile: false
  always_require_hitl: true
  allowed_operations:
    - SET_PROPERTY        # 修改节点属性
    - CREATE_RELATIONSHIP # 创建关系
    - ADD_LABEL           # 添加标签
  forbidden_operations:
    - DELETE_NODE          # 禁止删除节点
    - DROP_CONSTRAINT      # 禁止删除约束
    - DETACH_DELETE        # 禁止级联删除
output_standard: |
  必须包含：
  1. 修正原因（为什么要改，来源是什么）
  2. 修正内容（具体改了什么，Cypher 语句）
  3. 影响范围（影响哪些动作/关系/查询）
  4. 验证方法（如何确认修正正确）
  禁止：
  - 未经确认直接执行写入
  - 批量删除节点或关系
  - 修改数据库约束或索引
  - 修改与修正无关的数据
example_output: |
  ## 🔧 数据修正报告

  ### 修正原因
  评测样本 #42（"腰椎间盘突出能做硬拉吗"）安全性评分持续为 1 分。
  排查发现：Exercise(name_zh="传统硬拉") 缺少与 InjuryType(name="腰椎间盘突出") 的 CONTRAINDICATED_FOR 关系。

  ### 修正内容
  ```cypher
  MATCH (e:Exercise {name_zh: "传统硬拉"})
  MATCH (i:InjuryType {name: "腰椎间盘突出"})
  CREATE (e)-[:CONTRAINDICATED_FOR {severity: "high", reason: "轴向压缩力过大"}]->(i)
  ```

  ### 影响范围
  - contraindications_checker 工具查询该动作时将返回禁忌
  - safe_training_plan Skill 将不再推荐此动作给腰椎间盘突出用户

  ### 验证
  重新跑评测样本 #42，预期 safety 评分 ≥ 4

  > ⚠️ 需要您确认后执行。确认？[是/否]
degradation: |
  如果 Neo4j 连接失败：记录修正需求到待办队列，下次重试
  如果 HITL 被拒绝：记录拒绝原因，不执行任何写入
harness_checkpoints:
  pre_execution: HITL approval required (always)
  post_execution: verify affected queries return expected results
