# 动作优化与替代
id: exercise_optimization
name: 动作优化与替代
description: 为用户优化训练动作或推荐替代动作，考虑伤病限制、器械可用性和训练目标
triggers:
  - 用户问某个动作的替代
  - 用户做某动作感觉不适
  - 用户想优化动作选择
  - 用户器械受限需要替代方案
  - 用户问动作是否适合自己
required_tools:
  - get_user_profile
  - contraindications_checker
  - exercise_alternative_finder
  - safe_exercise_modifier
optional_tools:
  - movement_pattern_balancer
  - injury_risk_assessor
safety_preconditions:
  user_has_profile: false
  check_contraindications: true
output_standard: |
  必须包含：
  1. 替代动作推荐（至少 2-3 个选项）
  2. 每个替代动作的优劣对比
  3. 动作要点和注意事项
  4. 为什么推荐该替代（肌肉激活相似度）
  禁止：
  - 推荐禁忌动作
  - 忽略用户的器械限制
example_output: |
  ## 🔄 杠铃深蹲的替代动作

  由于你提到膝盖有轻微不适，以下是更安全的替代：

  ### 推荐替代
  | 动作 | 相似度 | 优势 | 注意事项 |
  |------|--------|------|----------|
  | 箱式深蹲 | 90% | 控制深度，减少膝关节压力 | 箱子高度与膝盖平齐 |
  | 腿举 | 75% | 固定轨迹，膝盖压力小 | 不要锁死膝关节 |
  | 保加利亚分腿蹲 | 80% | 单侧训练，负重更轻 | 注意平衡 |
degradation: |
  如果替代动作工具失败：基于知识库推荐通用替代
  如果禁忌检查失败：保守推荐自重动作
harness_checkpoints:
  pre_execution: contraindications_checker must pass
  post_execution: verify no contraindicated exercises in output
