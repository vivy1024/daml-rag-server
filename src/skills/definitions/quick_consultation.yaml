# 快速咨询
id: quick_consultation
name: 快速咨询
description: 回答用户关于健身、营养、训练的简短问题，无需完整方案制定
triggers:
  - 用户问简短的健身知识问题
  - 用户问训练频率/时间
  - 用户问补剂相关问题
  - 用户问恢复/睡眠建议
  - 用户问热身/拉伸方法
  - 一般性健身咨询
required_tools:
  - get_user_profile
optional_tools:
  - contraindications_checker
  - find_similar_training_cases
safety_preconditions:
  user_has_profile: false
  low_risk: true
output_standard: |
  必须包含：
  1. 直接回答用户问题
  2. 简要的科学依据
  3. 个性化建议（如有用户档案）
  禁止：
  - 过度展开（保持简洁）
  - 医学诊断
  - 推荐违禁补剂
example_output: |
  ## 💡 关于训练后蛋白质摄入

  训练后 30 分钟内摄入 20-40g 蛋白质是比较理想的，但"窗口期"没有传说中那么严格。

  **关键点：**
  - 每日总蛋白质摄入量比时机更重要
  - 目标：每公斤体重 1.6-2.2g 蛋白质
  - 训练后一餐正常吃即可，不必焦虑

  根据你 75kg 的体重，建议每天摄入 120-165g 蛋白质。
degradation: |
  如果用户档案获取失败：给出通用建议
  无需特殊降级处理
harness_checkpoints:
  pre_execution: none
  post_execution: verify answer is concise and accurate
