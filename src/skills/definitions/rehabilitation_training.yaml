# 康复训练方案
id: rehabilitation_training
name: 康复训练方案
description: 为有伤病或术后恢复需求的用户制定安全的康复训练方案
triggers:
  - 用户提到受伤恢复
  - 用户术后想恢复训练
  - 用户有慢性疼痛想通过训练改善
  - 用户问伤后多久能恢复训练
  - 用户想要康复训练计划
required_tools:
  - get_user_profile
  - contraindications_checker
  - injury_risk_assessor
  - safe_exercise_modifier
  - intelligent_exercise_selector
optional_tools:
  - movement_pattern_balancer
  - find_similar_training_cases
safety_preconditions:
  user_has_profile: true
  if_health_conditions: mandatory_safety_check
  requires_medical_clearance_note: true
output_standard: |
  必须包含：
  1. 当前伤病状态评估
  2. 安全的训练动作（避开受伤部位）
  3. 渐进恢复时间线
  4. 明确的禁忌动作列表
  5. 何时应就医的警示信号
  禁止：
  - 替代医疗建议
  - 推荐可能加重伤病的动作
  - 忽略疼痛信号
  - 给出过于激进的恢复时间线
example_output: |
  ## 🏥 腰椎间盘突出康复训练方案

  ### ⚠️ 重要提示
  本方案仅供参考，请在医生许可后执行。如有加重请立即停止。

  ### 当前阶段：急性期后恢复（第 4-8 周）

  ### 安全动作
  | 动作 | 目的 | 频率 |
  |------|------|------|
  | 麦肯基伸展 | 减轻椎间盘压力 | 每天3次 |
  | 鸟狗式 | 核心稳定 | 10次×3组 |
  | 臀桥 | 臀肌激活 | 12次×3组 |

  ### 禁忌动作 ❌
  - 硬拉（任何变式）
  - 深蹲（负重）
  - 仰卧起坐/卷腹
degradation: |
  如果禁忌检查失败：默认最保守方案，仅推荐自重活动度练习
  如果用户无详细伤病信息：建议先就医评估
harness_checkpoints:
  pre_execution: contraindications_checker and injury_risk_assessor must pass
  post_execution: verify zero contraindicated exercises in output
