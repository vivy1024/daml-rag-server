# 安全评估（伤病/禁忌）
id: safety_assessment
name: 安全评估
description: 评估用户的伤病状况和训练禁忌，确定哪些动作安全、哪些需要避免
triggers:
  - 用户提到身体不适
  - 用户有伤病想确认能否训练
  - 用户问某动作是否安全
  - 用户提到疼痛
  - 系统检测到用户有健康风险
required_tools:
  - get_user_profile
  - contraindications_checker
  - injury_risk_assessor
optional_tools:
  - safe_exercise_modifier
  - exercise_alternative_finder
safety_preconditions:
  user_has_profile: false
  always_run: true
output_standard: |
  必须包含：
  1. 风险等级评估（低/中/高）
  2. 禁忌动作清单
  3. 安全动作清单
  4. 需要注意的训练参数（强度/角度/范围）
  5. 何时应就医的建议
  禁止：
  - 做出医学诊断
  - 忽略用户描述的疼痛
  - 在高风险情况下推荐训练
example_output: |
  ## 🛡️ 安全评估报告

  ### 风险等级: 中等 ⚠️

  ### 你的情况
  - 右膝前交叉韧带术后 3 个月
  - 已获医生许可恢复轻度训练

  ### 禁忌动作 ❌
  - 跳跃类动作（跳箱、波比跳）
  - 深蹲（全幅度负重）
  - 弓步跳

  ### 安全动作 ✅
  - 腿屈伸（轻重量，限制角度）
  - 靠墙静蹲
  - 直腿硬拉（轻重量）
  - 上肢所有动作

  ### 建议
  > 如果训练中出现膝关节肿胀或锐痛，请立即停止并就医。
degradation: |
  如果禁忌检查工具失败：采用最保守策略，建议用户就医确认
  如果用户描述模糊：要求补充具体信息
harness_checkpoints:
  pre_execution: none (this skill IS the safety check)
  post_execution: risk level must be clearly stated
