# Alertmanager 配置文件
#
# ⚠️  重要：使用前必须替换以下占位符：
#   - PLACEHOLDER → 真实的 Slack Incoming Webhook URL
#     获取方式：https://api.slack.com/messaging/webhooks
#     格式示例：https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX
#
# 路由策略：
#   - severity=critical → 立即通知（group_wait: 0s）
#   - severity=warning  → 5 分钟聚合后通知（group_wait: 5m）

global:
  # 告警解除后等待多久才发送 resolved 通知
  resolve_timeout: 5m

# ─── 通知模板 ────────────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ─── 路由配置 ────────────────────────────────────────────────────────────────
route:
  # 默认接收器
  receiver: 'slack-warning'

  # 按 alertname + job 分组，减少告警风暴
  group_by: ['alertname', 'job']

  # 默认：5 分钟聚合（warning 级别）
  group_wait: 5m
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # critical 告警：立即通知，1 小时后重复
    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: false

    # warning 告警：5 分钟聚合，4 小时后重复（使用默认配置）
    - match:
        severity: warning
      receiver: 'slack-warning'
      continue: false

# ─── 接收器配置 ──────────────────────────────────────────────────────────────
receivers:
  # Critical 告警接收器 — 立即通知
  - name: 'slack-critical'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER'
        # ⚠️ 将上方 PLACEHOLDER 替换为真实的 Slack Webhook URL
        channel: '#alerts-critical'
        send_resolved: true
        title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *告警*: {{ .Annotations.summary }}
          *详情*: {{ .Annotations.description }}
          *开始时间*: {{ .StartsAt | since }}
          {{ end }}
        color: 'danger'

  # Warning 告警接收器 — 聚合通知
  - name: 'slack-warning'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/PLACEHOLDER'
        # ⚠️ 将上方 PLACEHOLDER 替换为真实的 Slack Webhook URL
        channel: '#alerts-warning'
        send_resolved: true
        title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *告警*: {{ .Annotations.summary }}
          *详情*: {{ .Annotations.description }}
          *开始时间*: {{ .StartsAt | since }}
          {{ end }}
        color: 'warning'

# ─── 抑制规则 ────────────────────────────────────────────────────────────────
# 当 ServiceDown 触发时，抑制同实例的其他告警（避免级联告警噪音）
inhibit_rules:
  - source_match:
      alertname: 'ServiceDown'
      severity: 'critical'
    target_match_re:
      severity: 'warning|critical'
    equal: ['instance', 'job']
