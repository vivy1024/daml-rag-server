# Alertmanager 配置文件 — 飞书告警版
#
# 告警链路：Prometheus → Alertmanager → daml-rag-server /webhooks/alertmanager → 飞书
#
# 配置步骤：
#   1. 在飞书群设置 → 群机器人 → 添加自定义机器人，获取 Webhook URL
#   2. 设置环境变量 FEISHU_WEBHOOK_URL=https://open.feishu.cn/open-apis/bot/v2/hook/xxx
#   3. 重启 daml-rag-server 容器
#
# 路由策略：
#   - severity=critical → 立即通知（group_wait: 0s）
#   - severity=warning  → 5 分钟聚合后通知

global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ─── 路由配置 ────────────────────────────────────────────────────────────────
route:
  receiver: 'feishu-default'
  group_by: ['alertname', 'job']
  group_wait: 5m
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # critical 告警：立即通知
    - match:
        severity: critical
      receiver: 'feishu-critical'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      continue: false

    # warning 告警：5 分钟聚合
    - match:
        severity: warning
      receiver: 'feishu-default'
      continue: false

# ─── 接收器配置（统一走 daml-rag-server 飞书转发）─────────────────────────────
receivers:
  - name: 'feishu-critical'
    webhook_configs:
      - url: 'http://fitness_daml_rag:8001/webhooks/alertmanager'
        send_resolved: true

  - name: 'feishu-default'
    webhook_configs:
      - url: 'http://fitness_daml_rag:8001/webhooks/alertmanager'
        send_resolved: true

# ─── 抑制规则 ────────────────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      alertname: 'ServiceDown'
      severity: 'critical'
    target_match_re:
      severity: 'warning|critical'
    equal: ['instance', 'job']
