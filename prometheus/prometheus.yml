# Prometheus 主配置文件
# 玉珍健身 DAML-RAG 服务监控
#
# 监控目标：
#   - DAML-RAG AI 服务 (8001/8002)
#   - Qdrant 向量数据库 (6333)
#   - Redis 缓存 (6379)
#   - Node Exporter 主机指标 (9100)
#   - cAdvisor 容器指标 (8080)

global:
  scrape_interval: 15s       # 每 15 秒抓取一次指标
  evaluation_interval: 15s   # 每 15 秒评估一次告警规则
  scrape_timeout: 10s

  # 外部标签（用于区分多集群环境）
  external_labels:
    cluster: 'fitness-local'
    env: 'development'

# ─── 告警规则文件 ─────────────────────────────────────────────────────────────
rule_files:
  - "alerts/core-alerts.yml"

# ─── Alertmanager 连接配置 ────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      # 超时配置
      timeout: 10s

# ─── 抓取目标配置 ─────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # DAML-RAG AI 服务 — FastAPI + 自定义指标
  - job_name: 'daml-rag-server'
    static_configs:
      - targets: ['daml-rag-server:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # DAML-RAG 健康检查端点
  - job_name: 'daml-rag-health'
    static_configs:
      - targets: ['daml-rag-server:8001']
    metrics_path: '/health'
    scrape_interval: 30s

  # Qdrant 向量数据库指标
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Redis 指标（需要 redis_exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node Exporter — 主机系统指标（CPU/内存/磁盘）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # cAdvisor — Docker 容器指标（内存/CPU/网络）
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
