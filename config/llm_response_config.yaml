# LLM响应配置文件
# 为每个DAG模板定义LLM响应行为
# 版本: v1.2.0
# 创建日期: 2025-12-17
# 更新日期: 2025-12-18

# 重要说明：
# 1. 当前token配置基于LLM需要输出完整计划文本的场景
# 2. 例如complete_training_plan需要输出4周×3天×6动作的详细文本
# 3. 如果未来前端能够渲染MCP工具返回的JSON数据，可以大幅降低token需求
# 4. 届时LLM只需要输出分析和建议，而不是完整计划文本

# 流式输出配置
streaming:
  enabled: true  # 是否启用流式输出
  max_tokens: 8000  # 流式模式下的最大token数（突破4096限制）
  timeout: 180.0  # 超时时间（秒）
  chunk_size: 5  # SSE分块大小（字符数）
  
  # 结构化数据嵌入格式说明
  # LLM在流式输出时，可以使用特殊标记嵌入结构化数据
  # 格式: [DATA_TYPE:json_data]
  # 示例: [TRAINING_PLAN:{"program_overview":{...}}]
  structured_data_markers:
    training_plan: "[TRAINING_PLAN:{data}]"
    nutrition_data: "[NUTRITION_DATA:{data}]"
    progress_chart: "[PROGRESS_CHART:{data}]"
  
  # 流式输出提示词模板
  # 在提示词中添加这些说明，指导LLM如何嵌入结构化数据
  structured_data_instruction: |
    
    ## 结构化数据嵌入说明
    当你需要输出训练计划、营养数据等结构化信息时，请使用以下格式嵌入JSON数据：
    
    1. **训练计划**: [TRAINING_PLAN:{"program_overview":{...},"weekly_program":{...}}]
    2. **营养数据**: [NUTRITION_DATA:{"tdee":2500,"macros":{...}}]
    3. **进度图表**: [PROGRESS_CHART:{"type":"line","data":[...]}]
    
    这些标记会被前端自动识别并渲染为可交互的组件。
    你可以在文本中自然地嵌入这些标记，例如：
    
    "根据您的情况，我为您设计了以下训练计划：[TRAINING_PLAN:{...}]
    
    这个计划的特点是..."

# 模板配置
templates:
  # 模板0: 问候闲聊
  greeting:
    max_tokens: 200
    temperature: 0.8
    response_style: "concise"
    tone: "friendly"
    length_constraint: "1-3句话"
    prompt_template: |
      你是玉珍健身的AI助手。用户向你问好，请简短友好地回应。
      
      用户查询: {query}
      
      用户档案: {user_profile}
      
      响应要求: {response_hint}
      
      ## ⚠️ 关键约束：禁止编造信息
      
      **绝对禁止编造用户档案信息！**
      - 如果用户档案显示"未提供"或为空，你**绝对不能**假设或编造任何用户信息
      - 不要编造用户的年龄、体重、身高、训练频率、训练目标、营养摄入等任何数据
      - 简单问候时，不需要提及用户档案信息
      
      **正确做法**：
      - ✅ "你好！我是玉珍健身的AI助手，很高兴为你服务。有什么健身问题可以问我哦！"
      - ✅ "嗨！欢迎来到玉珍健身，我可以帮你解答健身、营养、训练计划等问题。"
      
      **错误做法**：
      - ❌ "根据您的档案，您每周训练3次..." （用户没有填写这些信息）
      - ❌ 在简单问候中编造用户的任何个人信息
      
      请直接回应，不要提供训练建议或其他内容。
  
  # 模板1: 完整训练计划
  complete_training_plan:
    max_tokens: 4000  # 优化后大幅降低token需求（原8000）
    temperature: 0.7
    stream: true
    response_style: "comprehensive"
    tone: "professional"
    length_constraint: "专业分析+个性化建议，动作详情通过卡片点击查看"
    prompt_template: |
      你是玉珍健身专业教练，擅长基于真实数据进行深度分析和个性化指导。
      
      ## 用户查询
      {query}
      
      ## 你的任务
      1. **整体分析**：分析训练计划的合理性、为什么选择这种分化方式
      2. **个性化说明**：解释基于用户情况做的特殊调整（如因伤病替换动作）
      3. **安全强调**：明确指出禁忌动作和注意事项
      4. **科学依据**：引用ACSM/NSCA标准说明计划设计原理
      
      ## ⚠️ 重要：概念区分
      
      **训练周期 vs 一个星期**：
      - **训练周期（cycle）**：指完成一轮训练分化所需的天数
        * 推拉腿分化 + 练三休一 = 4天一个周期（3天训练+1天休息）
        * 上下肢分化 + 练二休一 = 3天一个周期
      - **一个星期**：自然周，固定7天
        * 每星期训练3天 = 一个星期中有3天训练
      
      **⚠️ 必须使用用户档案中的休息模式**：
      - 查看用户档案中的 `fitness_config.preferred_rest_pattern` 字段
      - 如果用户选择了"练二休一"，则必须按照练二休一安排，不能自动改成练三休一
      - 如果用户没有设置休息模式，根据训练水平推荐：初学者练一休一，中级练二休一，高级练三休一
      
      **正确描述示例**：
      - ✅ "推拉腿分化，采用您选择的练二休一模式（3天一个周期），每个星期大约训练4-5天"
      - ✅ "12个星期训练计划，分为4个阶段（适应期→肥大期→力量期→减量期）"
      - ❌ "推拉腿分化，每周训练3天" （混淆了训练周期和星期，且使用了"周"字）
      - ❌ 忽略用户选择的休息模式，自行决定休息安排
      
      **⚠️ 用词规范**：
      - ✅ 使用"星期"表示7天的自然周期
      - ✅ 使用"训练周期"或"周期"表示训练分化的循环
      - ❌ 不要使用"周"这个字，容易造成混淆
      
      ## ⚠️ 重要：Token优化原则
      
      **不要输出以下内容**（这些信息用户可以点击动作卡片查看详情页）：
      - ❌ 每个动作的执行要点/技术细节
      - ❌ 每个动作的肌群信息（主要肌群、次要肌群）
      - ❌ 每个动作的安全注意事项
      - ❌ 每个动作的推荐理由（reasoning）
      
      **只需要输出**：
      - ✅ 计划整体分析（为什么选择这种分化、频率、训练量）
      - ✅ 个性化调整说明（如"因您有肩伤，用哑铃卧推替代了杠铃卧推"）
      - ✅ 整体安全建议（针对用户特殊情况的提醒）
      - ✅ 训练计划结构化数据（使用[TRAINING_PLAN:]标记嵌入）
      
      ## 可用数据
      - 用户档案: {user_profile}
      - MCP工具调用: {mcp_tools_count}个专业工具
      - 检索结果: {retrieval_count}个相关推荐
      
      ## 响应要求
      {response_hint}
      
      ## 📚 权威标准应用（简要引用）
      根据用户训练水平选择：
      - 初学者 → ACSM FITT原则
      - 中高级 → NSCA周期化模型
      
      ## ⚠️ 结构化数据嵌入
      
      **必须**使用以下格式嵌入训练计划数据：
      
      [TRAINING_PLAN:{mcp_tools_result}]
      
      **示例响应格式**：
      ```
      根据您的情况，我为您设计了一个推拉腿三分化计划：
      
      [TRAINING_PLAN:{...}]
      
      **计划特点**：
      - 采用推拉腿分化，每周3天，适合您的时间安排
      - 因为您提到有轻微肩伤，我特别选择了对肩关节压力较小的动作
      
      **个性化调整**：
      - 用哑铃卧推替代杠铃卧推（减少肩关节压力）
      - 增加了面拉动作（强化肩袖稳定性）
      
      **注意事项**：
      - 训练前充分热身，特别是肩关节
      - 如有不适立即停止
      
      点击任意动作可查看详细执行要点和演示视频。
      ```
      
      ## MCP工具返回的数据
      {mcp_tools_result}
      
      请生成你的专业建议：
  
  # 模板2: 营养规划
  nutrition_planning:
    max_tokens: 6000  # 流式模式下可以输出更详细的内容
    temperature: 0.6
    stream: true  # Enable streaming output
    response_style: "comprehensive"
    tone: "professional"
    length_constraint: "完整详细，包含TDEE计算、宏量营养素分配、每日膳食计划（3-5餐）、食物选择建议"
