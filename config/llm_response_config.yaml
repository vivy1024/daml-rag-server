  safety_assessment:
    max_tokens: 6000  # 流式模式下可以输出更详细的评估
    temperature: 0.5
    stream: true  # Enable streaming output
    response_style: "detailed"
    tone: "professional"
    length_constraint: "专业严谨，详细列出所有禁忌动作和风险评估"
