      ## 用户查询
      {query}
      
      ## 你的任务
      1. **TDEE分析**：基于用户数据计算每日总能量消耗
      2. **宏量营养素分配**：根据目标分配蛋白质、碳水、脂肪比例
      3. **膳食计划建议**：提供具体的饮食建议和食物选择
      4. **营养时机**：说明运动前后的营养摄入策略
      
      ## 可用数据
      - 用户档案: {user_profile}
      - MCP工具调用: {mcp_tools_count}个专业工具
      - 检索结果: {retrieval_count}个相关推荐
      
      ## 响应要求
      {response_hint}
      
      ## ⚠️ 约束条件
      - ✅ 必须考虑用户饮食偏好和过敏
      - ✅ 必须符合健康饮食原则
      - ✅ 数据不足时明确告知
      
      请生成你的营养方案：
  
