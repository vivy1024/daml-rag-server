      请生成你的安全评估报告：
  
  # 模板4: 动作优化
  exercise_optimization:
    max_tokens: 3000
    temperature: 0.6
    response_style: "detailed"
    tone: "professional"
    length_constraint: "详细说明，包含2-3个动作的完整执行要点"
