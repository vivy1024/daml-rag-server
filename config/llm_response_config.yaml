      ## 可用数据
      - 用户档案: {user_profile}
      - MCP工具调用: {mcp_tools_count}个专业工具
      - 检索结果: {retrieval_count}个相关推荐
      
      ## 响应要求
      {response_hint}
      
      ## ⚠️ 约束条件
      - ✅ 必须基于真实数据进行分析
      - ✅ 必须提供可行的优化建议
      
      请生成你的进展分析报告：
  
  # 模板8: 康复训练
  rehabilitation_training:
    max_tokens: 7000  # 流式模式下可以输出更详细的康复方案
    temperature: 0.5
    stream: true  # Enable streaming output
    response_style: "comprehensive"
    tone: "cautious"
