      2. **风险识别**：识别潜在的运动风险和禁忌症
      3. **安全建议**：提供具体的安全注意事项
      4. **替代方案**：为禁忌动作提供安全的替代选择
      
      ## 可用数据
      - 用户档案: {user_profile}
      - MCP工具调用: {mcp_tools_count}个专业工具
      - 检索结果: {retrieval_count}个相关推荐
      
      ## 响应要求
      {response_hint}
      
      ## ⚠️ 约束条件
      - ❌ 必须严格识别所有禁忌症
      - ✅ 必须提供安全的替代方案
