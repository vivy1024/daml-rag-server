# 蓝绿多模型测试池配置
# 加权随机选择，weight 值越大被选中概率越高
# 总 weight = 100（百分比语义）
#
# cost_tier:
#   free       — 完全免费（SiliconFlow/智谱免费模型）
#   free_quota — 有免费额度（通义千问100万token）
#   low        — 低价（DeepSeek V3）
#   baseline   — 基准/付费（Claude/Kimi K2）
#
# context_window: 模型最大上下文窗口（tokens）
#   用于 TokenBudgetManager 动态预算分配
#   input_budget = context_window × 0.6（预留输出+安全边际）
#
# 必需环境变量（每个 backend 需要对应的 API_KEY）:
#   GLM_API_KEY        — 智谱 BigModel 开放平台
#   SILICONFLOW_API_KEY — SiliconFlow 平台
#   DEEPSEEK_API_KEY   — DeepSeek 平台
#   QWEN_API_KEY       — 阿里云 DashScope
#   MOONSHOT_API_KEY   — 月之暗面 Moonshot
#
# 注意：YAML 池启用后会自动注册后端客户端（_auto_register_from_yaml_pool），
# 但仍建议在 .env 中设置 XXX_ENABLED=true 以确保显式注册。
# 无 API_KEY 的后端会在选择时被自动过滤。
#
# 版本: v1.2.0
# 日期: 2026-02-23

# 是否启用 YAML 池（false 时回退到 MULTI_MODEL_POOL 环境变量）
enabled: true

pool:
  # === 免费模型 55% ===
  - backend: glm
    model: glm-4.7-flash
    weight: 20
    api_base: https://open.bigmodel.cn/api/paas/v4
    context_window: 128000
    cost_tier: free
    note: "智谱免费，128K上下文，稳定快速"

  - backend: siliconflow
    model: Qwen/Qwen3-8B
    weight: 15
    api_base: https://api.siliconflow.cn/v1
    context_window: 32000
    cost_tier: free
    note: "SiliconFlow免费，通义千问8B"

  - backend: siliconflow
    model: THUDM/GLM-Z1-9B-0414
    weight: 10
    api_base: https://api.siliconflow.cn/v1
    context_window: 32000
    cost_tier: free
    note: "SiliconFlow免费，GLM推理模型"

  - backend: siliconflow
    model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    weight: 10
    api_base: https://api.siliconflow.cn/v1
    context_window: 32000
    cost_tier: free
    note: "SiliconFlow免费，DeepSeek蒸馏"

  # === 低价模型 15% ===
  - backend: deepseek
    model: deepseek-chat
    weight: 15
    api_base: https://api.deepseek.com/v1
    context_window: 64000
    cost_tier: low
    note: "DeepSeek V3，低价高质"

  # === 免费额度模型 15% ===
  - backend: qwen
    model: qwen-turbo
    weight: 5
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 128000
    cost_tier: free_quota
    note: "通义千问turbo，100万token免费"

  - backend: qwen
    model: qwen-plus
    weight: 10
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 128000
    cost_tier: free_quota
    note: "通义千问plus，100万token免费"

  # === 基准模型 15% ===
  - backend: moonshot
    model: kimi-k2-0905-preview
    weight: 5
    api_base: https://api.moonshot.cn/v1
    context_window: 128000
    cost_tier: baseline
    note: "Kimi K2，月之暗面"
