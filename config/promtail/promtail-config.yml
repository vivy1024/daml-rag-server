# Promtail 配置文件
# 版本: v1.0.0
# 创建日期: 2025-12-23
# 说明: 用于采集DAML-RAG日志并发送到Loki

# 服务器配置
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# 位置文件（记录已读取的日志位置）
positions:
  filename: /tmp/positions.yaml

# Loki客户端配置
clients:
  - url: http://loki:3100/loki/api/v1/push
    # 批量发送配置
    batchwait: 1s
    batchsize: 1048576  # 1MB
    
    # 超时配置
    timeout: 10s
    
    # 重试配置
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    
    # 外部标签
    external_labels:
      cluster: fitness
      environment: production

# 日志采集配置
scrape_configs:
  # ==========================================
  # 配置1: 采集DAML-RAG Docker容器日志
  # ==========================================
  - job_name: daml-rag-container
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ['fitness_daml_rag']
    
    # 重新标记配置
    relabel_configs:
      # 只保留fitness_daml_rag容器
      - source_labels: ['__meta_docker_container_name']
        regex: '/(fitness_daml_rag)'
        action: keep
      
      # 设置容器名称标签
      - source_labels: ['__meta_docker_container_name']
        target_label: container
        regex: '/(.*)'
        replacement: '$1'
      
      # 设置日志流标签（stdout/stderr）
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    
    # 日志处理管道
    pipeline_stages:
      # 阶段1: 使用正则表达式解析日志
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<logger>\S+) - (?P<level>\S+) - (?P<message>.*)'
      
      # 阶段2: 提取标签
      - labels:
          level:
          logger:
      
      # 阶段3: 解析时间戳
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
          location: 'Asia/Shanghai'
      
      # 阶段4: 提取request_id（如果存在）
      - regex:
          source: message
          expression: '\[(?P<request_id>req_[a-zA-Z0-9]+)\]'
      
      # 阶段5: 将request_id设置为标签
      - labels:
          request_id:
      
      # 阶段6: 输出日志（用于调试）
      - output:
          source: message

  # ==========================================
  # 配置2: 采集DAML-RAG日志文件
  # ==========================================
  - job_name: daml-rag-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: daml-rag-files
          source: file
          __path__: /app/logs/daml-rag-*.log
    
    # 日志处理管道
    pipeline_stages:
      # 阶段1: 使用正则表达式解析日志
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<logger>\S+) - (?P<level>\S+) - (?P<message>.*)'
      
      # 阶段2: 提取标签
      - labels:
          level:
          logger:
      
      # 阶段3: 解析时间戳
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
          location: 'Asia/Shanghai'
      
      # 阶段4: 提取request_id（如果存在）
      - regex:
          source: message
          expression: '\[(?P<request_id>req_[a-zA-Z0-9]+)\]'
      
      # 阶段5: 将request_id设置为标签
      - labels:
          request_id:
      
      # 阶段6: 提取user_id（如果存在）
      - regex:
          source: message
          expression: 'user_id=(?P<user_id>[a-zA-Z0-9_]+)'
      
      # 阶段7: 将user_id设置为标签
      - labels:
          user_id:
      
      # 阶段8: 提取session_id（如果存在）
      - regex:
          source: message
          expression: 'session_id=(?P<session_id>[a-zA-Z0-9_]+)'
      
      # 阶段9: 将session_id设置为标签
      - labels:
          session_id:
      
      # 阶段10: 输出日志
      - output:
          source: message

  # ==========================================
  # 配置3: 采集错误日志文件
  # ==========================================
  - job_name: daml-rag-error-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: daml-rag-error-files
          source: file
          log_type: error
          __path__: /app/logs/daml-rag-error-*.log
    
    # 日志处理管道
    pipeline_stages:
      # 阶段1: 使用正则表达式解析日志
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (?P<logger>\S+) - (?P<level>\S+) - (?P<message>.*)'
      
      # 阶段2: 提取标签
      - labels:
          level:
          logger:
      
      # 阶段3: 解析时间戳
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
          location: 'Asia/Shanghai'
      
      # 阶段4: 提取request_id（如果存在）
      - regex:
          source: message
          expression: '\[(?P<request_id>req_[a-zA-Z0-9]+)\]'
      
      # 阶段5: 将request_id设置为标签
      - labels:
          request_id:
      
      # 阶段6: 提取错误类型（如果存在）
      - regex:
          source: message
          expression: 'error_type=(?P<error_type>[a-zA-Z0-9_]+)'
      
      # 阶段7: 将error_type设置为标签
      - labels:
          error_type:
      
      # 阶段8: 输出日志
      - output:
          source: message

# 限制配置
limits_config:
  # 每秒最大日志行数
  readline_rate: 10000
  readline_burst: 20000
  
  # 最大日志行大小
  max_line_size: 256KB

# 目标配置
target_config:
  # 同步周期
  sync_period: 10s

