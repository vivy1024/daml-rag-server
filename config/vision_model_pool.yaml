# Vision 多模态蓝绿池配置
# 独立于文本蓝绿池，专门管理 Vision-capable 模型
#
# context_window: 模型最大上下文窗口（tokens）
#
# 版本: v1.1.0
# 日期: 2026-02-23

enabled: true

pool:
  # === 免费 Vision 模型 60% ===
  - backend: siliconflow
    model: THUDM/GLM-4.1V-9B-Thinking
    weight: 40
    api_base: https://api.siliconflow.cn/v1
    context_window: 32000
    cost_tier: free
    note: "GLM-4.1V 视觉推理，SiliconFlow免费"

  - backend: siliconflow
    model: deepseek-ai/DeepSeek-OCR
    weight: 20
    api_base: https://api.siliconflow.cn/v1
    context_window: 32000
    cost_tier: free
    note: "DeepSeek OCR，SiliconFlow免费"

  # === 低价 Vision 模型 25% ===
  - backend: qwen
    model: qwen-vl-max
    weight: 25
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 128000
    cost_tier: low
    note: "通义千问VL-Max，视觉理解强"
