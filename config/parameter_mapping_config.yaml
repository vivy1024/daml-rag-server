# 参数映射配置文件
# 定义MCP工具的参数映射规则、重试策略和缓存配置
#
# 版本: v2.3.0
# 日期: 2026-03-01
# 作者: BUILD_BODY Team
#
# ⚠️ 重要：required_params必须与工具的Pydantic Input Schema完全匹配！
#
# 更新记录:
# - v2.3.0 (2026-03-01): 移除已废弃的chinese_to_enum转换器和valid_values_reference
#   - 前端已统一传递英文value，Neo4j也是英文name，无需中英文转换
#   - 有效枚举值定义已在 parameter_converter.py 的 VALID_* 常量中维护
# - v2.2.0 (2025-12-29): 添加_common_mappings配置
#   - 添加context任务的通用映射（user_id, query, session_id, user_profile）
#   - 添加query_analysis任务的通用映射（intent, entities, constraints, complexity, confidence）
#   - 支持EnhancedParameterExtractor的workflow state回退功能
#   - Requirements: 7.4, 7.5
# - v2.1.0 (2025-12-27): 补充所有缺失的参数映射规则
#   - 添加get_user_profile.user_id映射
#   - 添加exercise_alternative_finder.reason映射
#   - 添加safe_exercise_modifier.modification_purpose映射
#   - 添加injury_risk_assessor参数映射
#   - 添加professional_program_designer参数映射
#   - 添加periodized_program_designer参数映射
#   - 添加training_split_designer参数映射
#   - 添加tdee_calculator参数映射
#   - 添加meal_plan_designer参数映射
#   - 添加nutrition_intake_analyzer参数映射
#   - 添加exercise_nutrition_optimization参数映射

# ============================================================================
# 通用参数映射（所有工具共享）
# ============================================================================
# 这些映射定义了从workflow state提取标准参数的规则
# 当上游任务不在DAG执行结果中时，EnhancedParameterExtractor会使用这些映射
# Requirements: 7.4, 7.5
_common_mappings:
  # context任务的通用映射
  # 这些参数可以从workflow state直接提取
  context:
    - source_path: user_id
      target_param: user_id
      description: "用户ID，从workflow state的user_id字段提取"
    - source_path: query
      target_param: query
      description: "用户查询，从workflow state的query字段提取"
    - source_path: session_id
      target_param: session_id
      description: "会话ID，从workflow state的session_id字段提取"
    - source_path: user_profile
      target_param: user_profile
      description: "用户档案，从workflow state的user_profile字段提取"
  
  # query_analysis任务的通用映射
  # 这些参数可以从workflow state的query_analysis对象提取
  query_analysis:
    - source_path: intent
      target_param: intent
      description: "用户意图，从workflow state的query_analysis.intent字段提取"
    - source_path: entities
      target_param: entities
      description: "实体列表，从workflow state的query_analysis.entities字段提取"
    - source_path: constraints
      target_param: constraints
      description: "约束条件，从workflow state的query_analysis.constraints字段提取"
    - source_path: complexity
      target_param: complexity
      description: "查询复杂度，从workflow state的query_analysis.complexity字段提取"
    - source_path: confidence
      target_param: confidence
      description: "置信度，从workflow state的query_analysis.confidence字段提取"

# ============================================================================
# 工具参数映射规则
# ============================================================================
tools:
  # 用户档案工具 - Requirements 2.1
  get_user_profile:
    param_mappings:
      - source_task: context
        source_path: user_id
        target_param: user_id
    required_params:
      - user_id
    optional_params: []

  # 禁忌症检查器 - ContraindicationsCheckerInput
  contraindications_checker:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: intelligent_exercise_selector
        source_path: recommendations[*].exercise_id
        target_param: exercise_ids
        default_value: []
    required_params:
      - user_id
      - exercise_ids
    optional_params:
      - health_conditions
      - include_recommendations
      - strict_mode

  # 智能动作选择器 - IntelligentExerciseSelectorInput
  intelligent_exercise_selector:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: training_goal
        default_value: general_fitness
      - source_task: get_user_profile
        source_path: basic_info.fitness_level
        target_param: difficulty_level
        default_value: beginner
      - source_task: get_user_profile
        source_path: target_muscle_groups[0]
        target_param: muscle_group
        default_value: "胸部"
    required_params:
      - user_id
      - muscle_group
      - training_goal
      - difficulty_level
    optional_params:
      - available_equipment
      - safety_priority

  # 动作替代查找器 - ExerciseAlternativeFinderInput - Requirements 2.2
  # ⚠️ 注意：original_exercise_id 依赖于 intelligent_exercise_selector 的输出
  # 当上游任务没有返回有效的推荐时，使用默认值（空字符串会触发跳过逻辑）
  exercise_alternative_finder:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: intelligent_exercise_selector
        source_path: recommendations[0].exercise_id
        target_param: original_exercise_id
        default_value: ""  # 空字符串表示无法获取，工具应该被跳过
      - source_task: query_analysis
        source_path: intent
        target_param: reason
        default_value: equipment_unavailable
    required_params:
      - user_id
      - original_exercise_id
      - reason
    optional_params:
      - constraints
    # 跳过条件：当 original_exercise_id 为空时跳过此工具
    skip_conditions:
      - param: original_exercise_id
        condition: empty
        message: "跳过exercise_alternative_finder：无法从上游任务获取original_exercise_id"

  # 安全动作修改器 - SafeExerciseModifierInput - Requirements 2.3
  # ⚠️ 注意：exercise_id 依赖于 intelligent_exercise_selector 的输出
  # 当上游任务没有返回有效的推荐时，使用默认值（空字符串会触发跳过逻辑）
  safe_exercise_modifier:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: intelligent_exercise_selector
        source_path: recommendations[0].exercise_id
        target_param: exercise_id
        default_value: ""  # 空字符串表示无法获取，工具应该被跳过
      - source_task: query_analysis
        source_path: intent
        target_param: modification_purpose
        default_value: injury_prevention
    required_params:
      - user_id
      - exercise_id
      - modification_purpose
    optional_params:
      - user_injuries
      - safety_requirements
      - available_equipment
      - modification_preference

  # 损伤风险评估器 - InjuryRiskAssessorInput - Requirements 2.4
  injury_risk_assessor:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: context
        source_path: planned_exercises
        target_param: planned_exercises
        default_value: []
      - source_task: get_user_profile
        source_path: training_config.training_intensity
        target_param: training_intensity
        default_value: moderate
      - source_task: get_user_profile
        source_path: training_config.session_duration_minutes
        target_param: session_duration_minutes
        default_value: 60
    required_params:
      - user_id
      - training_intensity
      - session_duration_minutes
    optional_params:
      - planned_exercises
      - include_prevention_plan
      - risk_tolerance_level
      - previous_injuries
      - current_pain_areas

  # 专业训练计划设计器 - ProfessionalProgramDesignerInput - Requirements 2.5
  professional_program_designer:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: training_goal
        default_value: hypertrophy
      - source_task: get_user_profile
        source_path: basic_info.fitness_level
        target_param: difficulty_level
        default_value: beginner
      - source_task: get_user_profile
        source_path: training_config.available_equipment
        target_param: available_equipment
        default_value: ["哑铃", "杠铃"]
      - source_task: get_user_profile
        source_path: training_config.training_split
        target_param: training_split
        default_value: push_pull_legs
      - source_task: get_user_profile
        source_path: training_config.preferred_training_days
        target_param: training_days_per_week
        default_value: 3
    required_params:
      - user_id
      - training_goal
      - training_split
      - training_days_per_week
      - difficulty_level
      - available_equipment
    optional_params:
      - injury_history
      - target_muscle_groups

  # 周期化训练计划设计器 - PeriodizedProgramDesignerInput - Requirements 2.6
  periodized_program_designer:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: training_goal
        default_value: hypertrophy
      - source_task: get_user_profile
        source_path: basic_info.fitness_level
        target_param: difficulty_level
        default_value: beginner
      - source_task: get_user_profile
        source_path: training_config.available_equipment
        target_param: available_equipment
        default_value: ["哑铃", "杠铃"]
      - source_task: query_analysis
        source_path: program_duration_weeks
        target_param: program_duration_weeks
        default_value: 12
      - source_task: get_user_profile
        source_path: training_config.preferred_training_days
        target_param: training_days_per_week
        default_value: 3
    required_params:
      - user_id
      - training_goal
      - difficulty_level
      - program_duration_weeks
      - training_days_per_week
      - available_equipment
    optional_params:
      - injury_history
      - target_muscle_groups
      - periodization_model
      - include_deload_weeks
      - auto_progression

  # 训练分化设计器 - TrainingSplitDesignerInput - Requirements 2.7
  training_split_designer:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: basic_info.fitness_level
        target_param: training_level
        default_value: beginner
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: primary_goal
        default_value: hypertrophy
      - source_task: get_user_profile
        source_path: training_config.available_equipment
        target_param: available_equipment
        default_value: ["哑铃", "杠铃"]
      - source_task: get_user_profile
        source_path: training_config.preferred_training_days
        target_param: training_days_per_week
        default_value: 3
      - source_task: get_user_profile
        source_path: training_config.session_duration_minutes
        target_param: session_duration_minutes
        default_value: 60
    required_params:
      - user_id
      - training_level
      - primary_goal
      - training_days_per_week
      - session_duration_minutes
      - available_equipment
    optional_params:
      - muscle_group_focus
      - injury_history
      - preferred_split_type
      - include_cardio
      - rest_day_preference
      - time_constraints

  # TDEE计算器 - TDEECalculatorInput - Requirements 2.8
  tdee_calculator:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: training_config.preferred_training_days
        target_param: training_frequency_per_week
        default_value: 3
      - source_task: get_user_profile
        source_path: training_config.activity_level
        target_param: daily_activity_level
        default_value: moderately_active
      - source_task: get_user_profile
        source_path: training_config.training_intensity
        target_param: training_intensity
        default_value: moderate
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: fitness_goal
        default_value: maintenance
    required_params:
      - user_id
      - training_frequency_per_week
      - training_intensity
      - daily_activity_level
      - fitness_goal
    optional_params:
      - age
      - gender
      - weight_kg
      - height_cm
      - dietary_preference

  # 膳食计划设计器 - MealPlanDesignerInput - Requirements 2.9
  meal_plan_designer:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: tdee_calculator
        source_path: adjusted_tdee
        target_param: target_calories
        default_value: 2000
      - source_task: tdee_calculator
        source_path: macronutrient_distribution.protein_grams
        target_param: target_protein_grams
        default_value: 150
      - source_task: tdee_calculator
        source_path: macronutrient_distribution.carbs_grams
        target_param: target_carbs_grams
        default_value: 200
      - source_task: tdee_calculator
        source_path: macronutrient_distribution.fat_grams
        target_param: target_fat_grams
        default_value: 70
    required_params:
      - user_id
      - target_calories
      - target_protein_grams
      - target_carbs_grams
      - target_fat_grams
    optional_params:
      - dietary_preference
      - meals_per_day
      - training_days_per_week
      - fitness_goal

  # 肌群训练量计算器 - MuscleGroupVolumeCalculatorInput
  muscle_group_volume_calculator:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: target_muscle_groups[0]
        target_param: muscle_group
        default_value: "胸大肌"
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: training_goal
        default_value: hypertrophy
      - source_task: get_user_profile
        source_path: training_config.preferred_training_days
        target_param: training_frequency_per_week
        default_value: 3
    required_params:
      - user_id
      - muscle_group
      - training_goal
      - training_frequency_per_week
    optional_params:
