  # 动作模式平衡器 - MovementPatternBalancerInput
  movement_pattern_balancer:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: intelligent_exercise_selector
        source_path: recommendations[*].exercise_id
        target_param: current_program
        default_value: []
      - source_task: get_user_profile
        source_path: target_muscle_groups
        target_param: target_muscle_groups
        default_value: ["胸部", "背部"]
    required_params:
      - user_id
      - current_program
      - target_muscle_groups
    optional_params: []

  # 智能负重计算器 - IntelligentWeightCalculatorInput
  # ⚠️ 注意：exercise_id 依赖于 intelligent_exercise_selector 的输出
  # 当上游任务没有返回有效的推荐时，使用默认值（空字符串会触发跳过逻辑）
  intelligent_weight_calculator:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: intelligent_exercise_selector
        source_path: recommendations[0].exercise_id
        target_param: exercise_id
        default_value: ""  # 空字符串表示无法获取，工具应该被跳过
    required_params:
      - user_id
      - exercise_id
    optional_params:
      - training_goal
      - target_reps
      - target_rir
      - one_rm
      - recent_performance

  # 营养摄入分析器 - NutritionIntakeAnalyzerInput - Requirements 2.10
  nutrition_intake_analyzer:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: context
        source_path: food_intake
        target_param: daily_food_intake
        default_value: []
    required_params:
      - user_id
      - daily_food_intake
    optional_params:
      - target_calories
      - target_protein_grams
      - target_carbs_grams
      - target_fat_grams
      - include_micronutrients
      - fitness_goal

  # 运动营养优化器 - ExerciseNutritionOptimizationInput - Requirements 2.11
  exercise_nutrition_optimization:
    param_mappings:
      - source_task: get_user_profile
        source_path: user_id
        target_param: user_id
      - source_task: get_user_profile
        source_path: basic_info.weight
        target_param: weight_kg
        default_value: 70
      - source_task: query_analysis
        source_path: training_type
        target_param: training_type
        default_value: strength
      - source_task: get_user_profile
        source_path: training_config.session_duration_minutes
        target_param: training_duration_minutes
        default_value: 60
      - source_task: get_user_profile
        source_path: training_config.training_intensity
        target_param: training_intensity
        default_value: moderate
      - source_task: query_analysis
        source_path: training_time
        target_param: training_time
        default_value: morning
      - source_task: get_user_profile
        source_path: fitness_goals.primary_goals[0]
        target_param: fitness_goal
        default_value: maintenance
      - source_task: tdee_calculator
        source_path: macronutrient_distribution.protein_grams
        target_param: daily_protein_target
        default_value: 150
      - source_task: tdee_calculator
        source_path: macronutrient_distribution.carbs_grams
        target_param: daily_carbs_target
        default_value: 200
    required_params:
      - user_id
      - training_type
      - training_duration_minutes
      - training_intensity
      - training_time
      - weight_kg
      - fitness_goal
      - daily_protein_target
      - daily_carbs_target
    optional_params:
      - current_supplements


# ============================================================================
# 重试策略配置
# ============================================================================
retry_policies:
  ValidationError:
    should_retry: false
    max_attempts: 1
    reason: "参数验证错误通常是配置问题，重试无意义"
  
  NetworkError:
    should_retry: true
    max_attempts: 3
    delay: 1.0
    backoff: 2.0
    reason: "网络错误可能是临时的，适合重试"
  
  TimeoutError:
    should_retry: true
    max_attempts: 2
    delay: 2.0
    backoff: 1.5
    reason: "超时可能是服务繁忙，重试一次"
  
  MCPServerError:
    should_retry: false
    max_attempts: 1
    reason: "MCP服务器错误需要人工介入"
  
  ConversionError:
    should_retry: false
    max_attempts: 1
    reason: "数据转换错误是数据问题，重试无意义"
  
  default:
    should_retry: true
    max_attempts: 2
    delay: 1.0
    backoff: 2.0

# ============================================================================
# 缓存配置
# ============================================================================
cache_config:
  user_profile:
    enabled: true
    ttl: 300
    key_prefix: "user_profile:"
  
  membership_permissions:
    enabled: true
    ttl: 600
    key_prefix: "membership:"
  
  llm_response:
    enabled: true
    ttl: 3600
    key_prefix: "llm_response:"
  
  mcp_tool_result:
    enabled: true
    ttl: 1800
    key_prefix: "mcp_tool:"
    cacheable_tools:
      - get_user_profile
      - tdee_calculator
    non_cacheable_tools:
      - contraindications_checker
      - injury_risk_assessor
      - intelligent_exercise_selector

# ============================================================================
# 参数验证配置
# ============================================================================
validation_config:
  strict_mode: true
  use_default_on_failure: true
  verbose_logging: true
  missing_required_param_behavior: "error"
  type_mismatch_behavior: "error"
  invalid_enum_behavior: "warning"

# ============================================================================
# 日志配置
# ============================================================================
logging_config:
  parameter_extraction:
    enabled: true
    level: "INFO"
    include_values: true
    max_value_length: 100
  
  parameter_conversion:
    enabled: true
    level: "INFO"
    include_before_after: true
  
  parameter_validation:
    enabled: true
    level: "INFO"
    include_error_details: true
  
  trace_logging:
    enabled: true
    level: "INFO"
    include_timestamps: true
    include_execution_time: true
