  # ============ 通用缓存配置 ============
  
  # 默认配置（未配置的工具使用此配置）
  - name: default
    ttl: 300  # 5分钟
    level: l1_memory
    strategy: time_based
    preload: false
    max_size: 1000
    async_write: false
    timeout_ms: 1000
    fallback_ttl: 60
    metadata:
      description: "默认缓存配置"

# ============ 全局设置 ============
global_settings:
  max_memory_entries: 5000
  max_memory_mb: 256
  enable_async_write: true
  cleanup_interval_seconds: 60
  redis_prefix: "daml_rag:"
