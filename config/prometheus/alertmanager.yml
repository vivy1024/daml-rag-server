# Alertmanager 配置文件 — 飞书告警版
# 版本: v2.0.0
# 更新日期: 2026-02-21
# 需求: 6.4
#
# 告警链路：Prometheus → Alertmanager → daml-rag-server /webhooks/alertmanager → 飞书
#
# 配置步骤：
#   1. 在飞书群设置 → 群机器人 → 添加自定义机器人，获取 Webhook URL
#   2. 设置环境变量 FEISHU_WEBHOOK_URL=https://open.feishu.cn/open-apis/bot/v2/hook/xxx
#   3. 重启 daml-rag-server 容器

global:
  resolve_timeout: 5m

route:
  receiver: 'feishu-default'
  group_by: ['alertname', 'category', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    - match:
        severity: critical
      receiver: 'feishu-critical'
      group_wait: 0s
      repeat_interval: 1h

    - match:
        category: performance
      receiver: 'feishu-default'
      group_wait: 30s
      repeat_interval: 6h

    - match:
        category: availability
      receiver: 'feishu-critical'
      group_wait: 0s
      repeat_interval: 30m

inhibit_rules:
  - source_match:
      severity: 'critical'
      category: 'availability'
    target_match:
      severity: 'warning'
    equal: ['job']

  - source_match:
      alertname: 'CPUUsageCritical'
    target_match:
      alertname: 'CPUUsageHigh'
    equal: ['instance']

  - source_match:
      alertname: 'MemoryUsageCritical'
    target_match:
      alertname: 'MemoryUsageHigh'
    equal: ['instance']

receivers:
  - name: 'feishu-default'
    webhook_configs:
      - url: 'http://fitness_daml_rag:8001/webhooks/alertmanager'
        send_resolved: true

  - name: 'feishu-critical'
    webhook_configs:
      - url: 'http://fitness_daml_rag:8001/webhooks/alertmanager'
        send_resolved: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'
