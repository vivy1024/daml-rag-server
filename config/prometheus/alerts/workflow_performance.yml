# Prometheus 告警规则 - 工作流性能优化
# 版本: v1.0.0
# 创建日期: 2025-12-21
# 需求: 6.4

groups:
  # 性能瓶颈告警组
  - name: performance_bottleneck
    interval: 30s
    rules:
      # 工作流总耗时告警
      - alert: WorkflowTotalDurationHigh
        expr: workflow_total_duration_seconds > 30
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "工作流总耗时过高"
          description: "工作流总耗时 {{ $value }}秒，超过30秒阈值"
          
      # 步骤耗时告警
      - alert: WorkflowStepDurationHigh
        expr: workflow_step_duration_seconds > 1
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "步骤 {{ $labels.step }} 耗时过高"
          description: "步骤 {{ $labels.step }} 耗时 {{ $value }}秒，超过1秒阈值"
          
      # TTFB告警
      - alert: TTFBHigh
        expr: workflow_ttfb_seconds > 5
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "首字节响应时间过高"
          description: "TTFB {{ $value }}秒，超过5秒阈值"
          
      # 用户档案加载耗时告警
      - alert: UserProfileLoadingHigh
        expr: workflow_step_duration_seconds{step="1"} > 0.5
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "用户档案加载耗时过高"
          description: "用户档案加载耗时 {{ $value }}秒，超过500ms阈值"
          
      # 会员权限检查耗时告警
      - alert: MembershipCheckHigh
        expr: workflow_step_duration_seconds{step="3"} > 0.3
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "会员权限检查耗时过高"
          description: "会员权限检查耗时 {{ $value }}秒，超过300ms阈值"
          
      # BGE分类耗时告警
      - alert: BGEClassificationHigh
        expr: workflow_step_duration_seconds{step="4"} > 0.5
        for: 1m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "BGE复杂度分类耗时过高"
          description: "BGE分类耗时 {{ $value }}秒，超过500ms阈值"

  # 错误率告警组
  - name: error_rate
    interval: 30s
    rules:
      # 工作流失败率告警
      - alert: WorkflowFailureRateHigh
        expr: (1 - workflow_success_rate) > 0.05
        for: 2m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "工作流失败率过高"
          description: "工作流失败率 {{ $value | humanizePercentage }}，超过5%阈值"
          
      # LLM调用错误率告警
      - alert: LLMErrorRateHigh
        expr: llm_error_rate > 0.05
        for: 2m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "LLM调用错误率过高"
          description: "LLM错误率 {{ $value | humanizePercentage }}，超过5%阈值，错误类型: {{ $labels.error_type }}"
          
      # LLM降级次数告警
      - alert: LLMFallbackCountHigh
        expr: rate(llm_fallback_count[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          category: reliability
        annotations:
          summary: "LLM降级次数过多"
          description: "LLM降级到 {{ $labels.backend }} 的频率过高: {{ $value }}/秒"
          
      # 缓存失效率告警
      - alert: CacheMissRateHigh
        expr: cache_miss_rate > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "缓存未命中率过高"
          description: "{{ $labels.level }} 缓存未命中率 {{ $value | humanizePercentage }}，超过50%"

  # 资源使用告警组
  - name: resource_usage
    interval: 30s
    rules:
      # CPU使用率告警
      - alert: CPUUsageHigh
        expr: process_cpu_percent > 70
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "CPU使用率过高"
          description: "CPU使用率 {{ $value }}%，超过70%阈值"
          
      # CPU使用率严重告警
      - alert: CPUUsageCritical
        expr: process_cpu_percent > 90
        for: 1m
        labels:
          severity: critical
          category: resource
        annotations:
          summary: "CPU使用率严重过高"
          description: "CPU使用率 {{ $value }}%，超过90%阈值"
          
      # 内存使用率告警
      - alert: MemoryUsageHigh
        expr: process_memory_percent > 80
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "内存使用率过高"
          description: "内存使用率 {{ $value }}%，超过80%阈值"
          
      # 内存使用率严重告警
      - alert: MemoryUsageCritical
        expr: process_memory_percent > 95
        for: 1m
        labels:
          severity: critical
          category: resource
        annotations:
          summary: "内存使用率严重过高"
          description: "内存使用率 {{ $value }}%，超过95%阈值"
          
      # 连接池使用率告警
      - alert: ConnectionPoolUsageHigh
        expr: (connection_pool_active / (connection_pool_active + connection_pool_idle)) > 0.8
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "连接池使用率过高"
          description: "{{ $labels.pool }} 连接池使用率 {{ $value | humanizePercentage }}，超过80%"
          
      # 连接池等待时间告警
      - alert: ConnectionPoolWaitTimeHigh
        expr: connection_pool_wait_time_seconds > 2
        for: 1m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "连接池等待时间过长"
          description: "{{ $labels.pool }} 连接池等待时间 {{ $value }}秒，超过2秒阈值"

  # 并发控制告警组
  - name: concurrency_control
    interval: 30s
    rules:
      # 并发请求数告警
      - alert: ConcurrentRequestsHigh
        expr: workflow_concurrent_requests > 80
        for: 2m
        labels:
          severity: warning
          category: concurrency
        annotations:
          summary: "并发请求数接近上限"
          description: "当前并发请求数 {{ $value }}，接近100的上限"
          
      # 并发请求数严重告警
      - alert: ConcurrentRequestsCritical
        expr: workflow_concurrent_requests > 95
        for: 1m
        labels:
          severity: critical
          category: concurrency
        annotations:
          summary: "并发请求数严重过高"
          description: "当前并发请求数 {{ $value }}，接近系统上限"
          
      # 队列长度告警
      - alert: QueueLengthHigh
        expr: workflow_queue_length > 150
        for: 2m
        labels:
          severity: warning
          category: concurrency
        annotations:
          summary: "请求队列长度过长"
          description: "请求队列长度 {{ $value }}，接近200的上限"
          
      # 429错误率告警
      - alert: RateLimitErrorsHigh
        expr: rate(http_requests_total{status="429"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          category: concurrency
        annotations:
          summary: "限流错误频率过高"
          description: "429错误频率 {{ $value }}/秒，系统可能过载"

  # 服务健康告警组
  - name: service_health
    interval: 30s
    rules:
      # 服务不可用告警
      - alert: ServiceDown
        expr: up{job="daml-rag"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "DAML-RAG服务不可用"
          description: "DAML-RAG服务已停止响应"
          
      # Redis不可用告警
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Redis服务不可用"
          description: "Redis服务已停止响应，缓存功能降级"
          
      # MySQL不可用告警
      - alert: MySQLDown
        expr: mysql_up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "MySQL服务不可用"
          description: "MySQL服务已停止响应"
          
      # Neo4j不可用告警
      - alert: Neo4jDown
        expr: neo4j_up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Neo4j服务不可用"
          description: "Neo4j服务已停止响应"
