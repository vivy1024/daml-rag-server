# Grafana 仪表板自动配置
# 版本: v1.1.0
# 创建日期: 2025-12-19
# 更新日期: 2025-12-20

apiVersion: 1

providers:
  # DAML-RAG 仪表板提供器
  - name: 'DAML-RAG'
    orgId: 1
    folder: 'DAML-RAG'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
