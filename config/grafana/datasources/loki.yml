# Grafana Loki 数据源配置
# 版本: v1.0.0
# 创建日期: 2025-12-23
# 说明: 配置Loki日志聚合系统作为Grafana数据源

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    
    # JSON数据配置
    jsonData:
      # 查询参数
      maxLines: 1000
      timeout: 60
      
      # Derived Fields - 从日志中提取字段并创建链接
      derivedFields:
        # Request ID 链接 - 点击request_id可以查看该请求的所有日志
        - datasourceUid: loki
          matcherRegex: "request_id[=:]\\s*([a-zA-Z0-9_-]+)"
          name: RequestID
          url: "/explore?left=[\"now-1h\",\"now\",\"Loki\",{\"expr\":\"{job=\\\"daml-rag\\\"} |= \\\"$${__value.raw}\\\"\"}]"
          urlDisplayLabel: "查看完整请求链路"
        
        # User ID 链接 - 点击user_id可以查看该用户的所有日志
        - datasourceUid: loki
          matcherRegex: "user_id[=:]\\s*([0-9]+)"
          name: UserID
          url: "/explore?left=[\"now-24h\",\"now\",\"Loki\",{\"expr\":\"{job=\\\"daml-rag\\\"} |= \\\"user_id=$${__value.raw}\\\"\"}]"
          urlDisplayLabel: "查看用户所有请求"
        
        # Session ID 链接 - 点击session_id可以查看该会话的所有日志
        - datasourceUid: loki
          matcherRegex: "session_id[=:]\\s*([a-zA-Z0-9_-]+)"
          name: SessionID
          url: "/explore?left=[\"now-1h\",\"now\",\"Loki\",{\"expr\":\"{job=\\\"daml-rag\\\"} |= \\\"$${__value.raw}\\\"\"}]"
          urlDisplayLabel: "查看会话日志"

