# 流式输出告警规则配置
# 版本: v1.0.0
# 创建日期: 2025-12-19

groups:
  - name: streaming_output_alerts
    interval: 1m
    rules:
      # 告警1: 成功率低于95%
      - alert: StreamingSuccessRateLow
        expr: |
          sum(rate(streaming_sessions_success_total[5m])) / sum(rate(streaming_sessions_total[5m])) < 0.95
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出成功率过低"
          description: "流式输出成功率为 {{ $value | humanizePercentage }}，低于95%阈值"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警2: TTFB超过3秒
      - alert: StreamingTTFBHigh
        expr: |
          histogram_quantile(0.95, rate(streaming_ttfb_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出TTFB过高"
          description: "流式输出P95 TTFB为 {{ $value | humanizeDuration }}，超过3秒阈值"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警3: 错误率超过5%
      - alert: StreamingErrorRateHigh
        expr: |
          sum(rate(streaming_errors_total[5m])) / sum(rate(streaming_sessions_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          component: streaming
        annotations:
          summary: "流式输出错误率过高"
          description: "流式输出错误率为 {{ $value | humanizePercentage }}，超过5%阈值"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警4: 降级率过高
      - alert: StreamingDegradationRateHigh
        expr: |
          sum(rate(streaming_degradation_events_total[5m])) / sum(rate(streaming_sessions_total[5m])) > 0.10
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出降级率过高"
          description: "流式输出降级率为 {{ $value | humanizePercentage }}，超过10%阈值"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警5: 生成速度过慢
      - alert: StreamingGenerationSpeedLow
        expr: |
          avg(rate(streaming_tokens_generated_total[5m]) / rate(streaming_duration_seconds_sum[5m])) < 5
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出生成速度过慢"
          description: "流式输出平均生成速度为 {{ $value | printf \"%.1f\" }} tokens/s，低于5 tokens/s阈值"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警6: 并发连接数过高
      - alert: StreamingConcurrentConnectionsHigh
        expr: |
          streaming_active_connections > 100
        for: 2m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出并发连接数过高"
          description: "当前活跃流式连接数为 {{ $value }}，超过100个阈值，可能影响系统性能"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警7: 总耗时过长
      - alert: StreamingDurationHigh
        expr: |
          histogram_quantile(0.95, rate(streaming_duration_seconds_bucket[5m])) > 60
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出总耗时过长"
          description: "流式输出P95总耗时为 {{ $value | humanizeDuration }}，超过60秒阈值"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
      
      # 告警8: 重试次数过多
      - alert: StreamingRetryCountHigh
        expr: |
          sum(rate(streaming_retry_count_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "流式输出重试次数过多"
          description: "流式输出每秒重试次数为 {{ $value | printf \"%.1f\" }}，可能存在稳定性问题"
          dashboard: "http://localhost:3001/d/streaming-output-performance"
